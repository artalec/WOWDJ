name: Build DJPlayer

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Шага xcode-select нет специально: на macos-latest уже выбран рабочий Xcode.
      # Жёсткий путь вида /Applications/Xcode_15.0.app ломает job, если такой версии нет.
      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Check project layout
        run: |
          set -euo pipefail
          test -f Package.swift || { echo "::error::Package.swift не найден в корне репозитория"; exit 1; }
          test -d Sources || { echo "::error::Папка Sources не найдена в корне репозитория"; exit 1; }
          test -f Resources/Info.plist || { echo "::error::Resources/Info.plist не найден"; exit 1; }
          ls -la

      - name: Build (release)
        run: swift build -c release

      - name: Assemble .app bundle
        run: |
          set -euo pipefail
          BIN_DIR="$(swift build -c release --show-bin-path)"
          BIN="$BIN_DIR/DJPlayer"
          test -f "$BIN" || { echo "::error::Бинарник $BIN не найден"; exit 1; }

          APP="DJPlayer.app"
          rm -rf "$APP"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp "$BIN" "$APP/Contents/MacOS/DJPlayer"
          cp Resources/Info.plist "$APP/Contents/Info.plist"
          printf 'APPL????' > "$APP/Contents/PkgInfo"
          chmod +x "$APP/Contents/MacOS/DJPlayer"

          # Ad-hoc подпись, чтобы приложение запускалось без испорченной подписи.
          codesign --force --deep --sign - "$APP" || echo "::warning::codesign не выполнен, приложение будет без подписи"

          ls -laR "$APP/Contents" | head -50

      - name: Archive .app
        run: |
          set -euo pipefail
          ditto -c -k --sequesterRsrc --keepParent DJPlayer.app DJPlayer.app.zip
          ls -lh DJPlayer.app.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DJPlayer-macOS
          path: DJPlayer.app.zip
          retention-days: 30
